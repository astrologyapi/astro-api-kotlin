group=com.astrologyapi
version=1.0.0
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
# Workaround: Kotlin 2.1.x's JavaVersion.parse() cannot handle bare JDK 25 version string.
# The Kotlin compiler daemon JVM args are overridden in build.gradle (kotlinDaemonJvmArguments).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=384m
